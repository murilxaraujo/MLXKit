name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          swift --version

      - name: Build
        run: swift build

      - name: Unit Tests
        run: swift test

      - name: GPU Tests
        run: |
          xcodebuild test \
            -scheme MLXKit-Package \
            -destination 'platform=macOS' \
            -only-testing:MLXKitTests \
            OTHER_SWIFT_FLAGS='-DMLX_GPU_TESTS' \
            -parallel-testing-enabled NO
