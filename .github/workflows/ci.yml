name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer

      - name: Record validation environment
        run: |
          sw_vers
          os_version="$(sw_vers -productVersion)"
          architecture="$(uname -m)"
          echo "Architecture: ${architecture}"
          xcodebuild -version
          swift --version
          grep -A 6 '"identity" : "mlx-swift"' Package.resolved
          case "${os_version}" in
            27.*) ;;
            *) echo "CI support job requires macOS 27.x; found ${os_version}" >&2; exit 1 ;;
          esac
          if [ "${architecture}" != "arm64" ]; then
            echo "CI support job requires Apple silicon (arm64); found ${architecture}" >&2
            exit 1
          fi

      - name: Build
        run: swift build

      - name: Unit Tests
        run: swift test

      - name: Build DocC Documentation
        run: make docs

      - name: M7 Example Smoke Runs
        run: make smoke-examples

      - name: GPU Tests
        run: |
          xcodebuild test \
            -scheme MLXKit-Package \
            -destination 'platform=macOS' \
            -only-testing:MLXKitTests \
            OTHER_SWIFT_FLAGS='-DMLX_GPU_TESTS' \
            -parallel-testing-enabled NO
